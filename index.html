<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoClientes Venezuela</title>
  <meta name="description" content="Mapa interactivo para visualizar clientes y competencia en Venezuela conectado a Google Sheets." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Plus Jakarta Sans", "Inter", "sans-serif"]
          },
          colors: {
            ink: "#070a12",
            glass: "rgba(15, 23, 42, 0.68)"
          },
          boxShadow: {
            glow: "0 0 36px rgba(45, 212, 191, 0.18)",
            dangerGlow: "0 0 36px rgba(251, 113, 133, 0.18)"
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: light;
      --panel: rgba(255, 255, 255, 0.96);
      --line: rgba(15, 23, 42, 0.18);
      --muted: #475569;
      --emerald: #059669;
      --cyan: #0891b2;
      --rose: #e11d48;
      --orange: #ea580c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(14, 116, 144, 0.18), transparent 30%),
        radial-gradient(circle at 84% 16%, rgba(15, 118, 110, 0.14), transparent 28%),
        linear-gradient(135deg, #d8e3ee 0%, #eef4f8 46%, #dbe7ef 100%);
      color: #0f172a;
      font-family: Inter, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(390px, 430px) 1fr;
      padding: 14px;
      gap: 14px;
    }

    .glass-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .sidebar {
      position: relative;
      z-index: 20;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      overflow: hidden;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.20);
      background: #dbeafe;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 360px;
      background: #dbeafe;
    }

    .leaflet-control-zoom a {
      background: rgba(255, 255, 255, 0.92) !important;
      color: #0f172a !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 22px 56px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(16px);
    }

    .leaflet-popup-content { margin: 0; width: 330px !important; }
    .leaflet-popup-close-button { color: #334155 !important; }

    .custom-marker {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.34);
    }

    .custom-marker::before,
    .custom-marker::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      background: currentColor;
      opacity: 0.22;
      animation: markerPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      z-index: -1;
    }

    .custom-marker::after {
      inset: -14px;
      animation-delay: .55s;
      opacity: .12;
    }

    .marker-client {
      color: rgba(52, 211, 153, 0.7);
      background: linear-gradient(135deg, #059669, #0284c7);
    }

    .marker-competition {
      color: rgba(251, 113, 133, 0.72);
      background: linear-gradient(135deg, #e11d48, #ea580c);
    }

    .marker-icon svg {
      width: 17px;
      height: 17px;
      color: #ffffff;
      stroke-width: 2.6;
    }

    @keyframes markerPing {
      0% { transform: scale(.65); opacity: .32; }
      70%, 100% { transform: scale(1.75); opacity: 0; }
    }

    .marker-cluster div {
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      line-height: 42px;
      text-align: center;
      background: linear-gradient(135deg, rgba(5, 150, 105, .96), rgba(2, 132, 199, .96));
      border: 2px solid rgba(255, 255, 255, .9);
      box-shadow: 0 12px 28px rgba(15, 23, 42, .24), 0 0 0 6px rgba(8, 145, 178, .18);
      text-shadow: 0 1px 2px rgba(15, 23, 42, .28);
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background: rgba(255, 255, 255, .52);
      border: 1px solid rgba(8, 145, 178, .28);
      backdrop-filter: blur(10px);
    }

    .cluster-small div {
      width: 42px;
      height: 42px;
      line-height: 38px;
      background: linear-gradient(135deg, #0f766e, #0284c7);
    }

    .cluster-medium div {
      width: 50px;
      height: 50px;
      line-height: 46px;
      font-size: 15px;
      background: linear-gradient(135deg, #0369a1, #4338ca);
      box-shadow: 0 14px 30px rgba(30, 64, 175, .26), 0 0 0 7px rgba(67, 56, 202, .16);
    }

    .cluster-large div {
      width: 60px;
      height: 60px;
      line-height: 56px;
      font-size: 16px;
      background: linear-gradient(135deg, #7f1d1d, #be123c);
      box-shadow: 0 16px 34px rgba(190, 18, 60, .28), 0 0 0 8px rgba(190, 18, 60, .14);
    }

    .scroll-area {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, .35) transparent;
    }

    .scroll-area::-webkit-scrollbar { width: 8px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, .28);
      border-radius: 99px;
    }

    .record-card {
      transform: translateY(0);
      transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    }

    .record-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 211, 238, .34);
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 18px 38px rgba(15, 23, 42, .18);
    }

    .sheet-handle { display: none; }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(148, 163, 184, .12);
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .modal-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      transform: translateY(18px) scale(.98);
      opacity: 0;
      transition: transform .28s ease, opacity .28s ease;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .toast {
      transform: translateY(-14px);
      opacity: 0;
      pointer-events: none;
      transition: transform .25s ease, opacity .25s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .app-shell {
        display: block;
        padding: 0;
        height: 100dvh;
      }

      .map-wrap {
        height: 100dvh;
        border-radius: 0;
        border: 0;
      }

      .sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 650;
        height: min(82dvh, 720px);
        border-radius: 18px 18px 0 0;
        transform: translateY(calc(100% - 132px));
        transition: transform .34s cubic-bezier(.22, 1, .36, 1);
        box-shadow: 0 -18px 60px rgba(15, 23, 42, .18);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .sidebar.expanded { transform: translateY(0); }

      .sheet-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        flex: 0 0 auto;
        touch-action: manipulation;
      }

      .sheet-handle::before {
        content: "";
        width: 54px;
        height: 5px;
        border-radius: 999px;
        background: rgba(71, 85, 105, .34);
      }

      .mobile-map-top {
        display: flex !important;
        top: calc(12px + env(safe-area-inset-top));
        left: 12px;
        right: 12px;
      }

      .leaflet-control-zoom {
        margin-bottom: 150px !important;
      }

      .sidebar header {
        padding: 0 16px 12px !important;
      }

      .sidebar header .mb-4 {
        margin-bottom: 10px !important;
      }

      .sidebar h1 {
        font-size: 20px !important;
        line-height: 1.15 !important;
      }

      .sidebar header p {
        display: none;
      }

      #newRecordBtn {
        display: none;
      }

      .sidebar > section {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }

      .sidebar > section:nth-of-type(1) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
      }

      .stat-card {
        min-height: 66px;
        padding: 10px !important;
      }

      .stat-card strong {
        font-size: 22px !important;
      }

      #typeTabs {
        gap: 6px;
      }

      .type-tab,
      #fitBtn,
      #refreshBtn {
        min-height: 44px;
      }

      #searchInput,
      #stateFilter,
      #zoneFilter {
        min-height: 46px;
        font-size: 16px;
      }

      .record-card {
        padding: 14px !important;
      }

      #list {
        padding-left: 16px !important;
        padding-right: 16px !important;
        padding-bottom: calc(18px + env(safe-area-inset-bottom)) !important;
      }

      .modal-backdrop {
        align-items: end;
        padding: 0;
      }

      .modal-card {
        width: 100%;
        max-width: none;
        max-height: 94dvh;
        border-radius: 18px 18px 0 0;
      }

      .modal-card .scroll-area {
        max-height: calc(94dvh - 148px) !important;
      }

      .modal-card input,
      .modal-card select {
        min-height: 48px;
        font-size: 16px;
      }

      #toast {
        left: 12px;
        right: 12px;
        top: calc(12px + env(safe-area-inset-top));
      }
    }

    @media (max-width: 430px) {
      .sidebar {
        height: 84dvh;
        transform: translateY(calc(100% - 126px));
      }

      .sidebar > section:nth-of-type(2) .grid.grid-cols-2 {
        grid-template-columns: 1fr;
      }

      .stat-card span {
        font-size: 11px !important;
      }
    }
  </style>
  <style>

    .light-ui .sidebar,
    .light-ui .modal-card {
      color: #0f172a;
    }

    .light-ui .sidebar .text-white,

    .light-ui .sidebar .record-meta,

    .light-ui input,

<body class="light-ui">
  <div id="toast" class="toast fixed right-5 top-5 z-[80] rounded-lg border border-emerald-300/20 bg-slate-950/80 px-4 py-3 text-sm text-slate-100 shadow-glow backdrop-blur-md">
    <div class="flex items-center gap-3">
      <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-300"></i>
      <span id="toastText">Registro guardado</span>
    </div>
  </div>

  <main class="app-shell">
    <aside id="sidebar" class="sidebar glass-panel">
      <button id="sheetToggle" class="sheet-handle" aria-label="Abrir panel"></button>

      <header class="border-b border-slate-200/10 px-5 pb-4 pt-4">
        <div class="mb-4 flex items-start justify-between gap-4">
          <div>

  <datalist id="venezuelaStates">
    <option value="Amazonas"></option>
    <option value="Anzoátegui"></option>

    <option value="Barinas"></option>
    <option value="Bolívar"></option>
    <option value="Carabobo"></option>
    <option value="Cojedes"></option>
    <option value="Delta Amacuro"></option>
    <option value="Distrito Capital"></option>
    <option value="Falcón"></option>
    <option value="Guárico"></option>
    <option value="Lara"></option>
    <option value="Mérida"></option>
    <option value="Miranda"></option>
    <option value="Monagas"></option>
    <option value="Nueva Esparta"></option>
    <option value="Portuguesa"></option>
    <option value="Sucre"></option>
    <option value="Táchira"></option>
    <option value="Trujillo"></option>
    <option value="La Guaira"></option>
    <option value="Yaracuy"></option>
    <option value="Zulia"></option>
  </datalist>

  <script>
    const CONFIG = {
      SHEET_URL: "https://script.google.com/macros/s/AKfycbxWQrmcFE5a8k9_O1oZB7X4qkLwvB9O7d8Z529-90hxb5BiERmH_4Vk5WRo8ojQj0Y/exec",
      DEFAULT_CENTER: [10.4806, -66.9036],
      DEFAULT_ZOOM: 6
    };

    let map, markersCluster, recordsData = [], markersMap = new Map();
    let selectedType = "TODOS";

    const MOCK_DATA = [
      {
        TIPO: "CLIENTE",
        NOMBRE: "Farmacia Central",
        ZONA: "Chacao",
        ESTADO: "Miranda",
        DIRECCION: "Av. Francisco de Miranda, Edif. Galipán",
        COORDENADAS: "10.4910, -66.8520",
        TELEFONO: "+58 412 111 2233",
        INSTAGRAM: "@farmaciacentral",
        CORREO: "contacto@farmaciacentral.ve",
        WEB: "https://farmaciacentral.ve"
      },
      {
        TIPO: "COMPETENCIA",
        NOMBRE: "Distribuidora Médica del Este",
        ZONA: "Las Mercedes",
        ESTADO: "Miranda",
        DIRECCION: "Calle Paris, Torre B",
        COORDENADAS: "10.4800, -66.8600",
        TELEFONO: "+58 414 999 8877",
        INSTAGRAM: "@distribuidoramedica",
        CORREO: "ventas@distribuidoramedica.com",
        WEB: ""
      },
      {
        TIPO: "CLIENTE",
        NOMBRE: "Supermercado El Sol",
        ZONA: "Valencia Centro",
        ESTADO: "Carabobo",
        DIRECCION: "Av. Bolívar Norte, Sector La Alegría",
        COORDENADAS: "10.2200, -68.0050",
        TELEFONO: "+58 416 333 4455",
        INSTAGRAM: "@elsol_valencia",
        CORREO: "info@elsol.com.ve",
        WEB: "https://elsol.com.ve"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      initEvents();
      loadData();
    });

    function initMap() {
      map = L.map("map", { zoomControl: true }).setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      markersCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        iconCreateFunction: (cluster) => {
          const count = cluster.getChildCount();
          let cClass = "cluster-small";
          if (count > 10) cClass = "cluster-medium";
          if (count > 25) cClass = "cluster-large";
          return L.divIcon({
            html: `<div><span>${count}</span></div>`,
            className: `marker-cluster ${cClass}`,
            iconSize: L.point(40, 40)
          });
        }
      });

      map.addLayer(markersCluster);
    }

    function initEvents() {
      document.getElementById("refreshBtn").addEventListener("click", loadData);
      document.getElementById("fitBtn").addEventListener("click", fitBounds);
      document.getElementById("newRecordBtn").addEventListener("click", openModal);
      document.getElementById("mobileNewBtn").addEventListener("click", openModal);
      document.getElementById("closeModalBtn").addEventListener("click", closeModal);
      document.getElementById("cancelBtn").addEventListener("click", closeModal);
      document.getElementById("recordForm").addEventListener("submit", handleFormSubmit);

      document.getElementById("searchInput").addEventListener("input", filterAndRender);
      document.getElementById("stateFilter").addEventListener("change", filterAndRender);
      document.getElementById("zoneFilter").addEventListener("change", filterAndRender);

      document.querySelectorAll("#typeTabs button").forEach(btn => {
        btn.addEventListener("click", (e) => {
          document.querySelectorAll("#typeTabs button").forEach(b => b.classList.remove("is-active"));
          e.target.classList.add("is-active");
          selectedType = e.target.dataset.type;
          filterAndRender();
        });
      });

      document.querySelectorAll("[data-stat-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetType = btn.dataset.statFilter;
          const tabBtn = document.querySelector(`#typeTabs button[data-type="${targetType}"]`);
          if (tabBtn) tabBtn.click();
        });
      });

      const sidebar = document.getElementById("sidebar");
      document.getElementById("sheetToggle").addEventListener("click", () => {
        sidebar.classList.toggle("expanded");
      });
    }

    async function loadData() {
      showLoading(true);
      try {
        const response = await fetch(CONFIG.SHEET_URL);
        if (!response.ok) throw new Error("Error de red");
        const data = await response.json();
        recordsData = Array.isArray(data) && data.length > 0 ? data : MOCK_DATA;
      } catch (err) {
        console.warn("No se pudo cargar desde Apps Script, utilizando datos de prueba.", err);
        recordsData = MOCK_DATA;
      } finally {
        populateFilterDropdowns();
        filterAndRender();
        showLoading(false);
        if (window.lucide) lucide.createIcons();
      }
    }

    function populateFilterDropdowns() {
      const stateSelect = document.getElementById("stateFilter");
      const zoneSelect = document.getElementById("zoneFilter");

      const states = [...new Set(recordsData.map(r => r.ESTADO).filter(Boolean))].sort();
      const zones = [...new Set(recordsData.map(r => r.ZONA).filter(Boolean))].sort();

      stateSelect.innerHTML = '<option value="">Todos</option>' + states.map(s => `<option value="${s}">${s}</option>`).join("");
      zoneSelect.innerHTML = '<option value="">Todas</option>' + zones.map(z => `<option value="${z}">${z}</option>`).join("");
    }

    function filterAndRender() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const state = document.getElementById("stateFilter").value;
      const zone = document.getElementById("zoneFilter").value;

      const filtered = recordsData.filter(item => {
        const matchType = selectedType === "TODOS" || (item.TIPO || "").toUpperCase() === selectedType;
        const matchState = !state || item.ESTADO === state;
        const matchZone = !zone || item.ZONA === zone;
        const matchSearch = !search ||
          (item.NOMBRE || "").toLowerCase().includes(search) ||
          (item.DIRECCION || "").toLowerCase().includes(search) ||
          (item.ZONA || "").toLowerCase().includes(search);

        return matchType && matchState && matchZone && matchSearch;
      });

      renderStats();
      renderList(filtered);
      renderMapMarkers(filtered);
    }

    function renderStats() {
      const total = recordsData.length;
      const clients = recordsData.filter(r => (r.TIPO || "").toUpperCase() === "CLIENTE").length;
      const competition = recordsData.filter(r => (r.TIPO || "").toUpperCase() === "COMPETENCIA").length;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("clientCount").textContent = clients;
      document.getElementById("competitionCount").textContent = competition;
    }

    function renderList(data) {
      const listEl = document.getElementById("list");
      document.getElementById("visibleCount").textContent = data.length;

      if (data.length === 0) {
        listEl.innerHTML = `<div class="p-6 text-center text-sm text-slate-400">No se encontraron registros.</div>`;
        return;
      }

      listEl.innerHTML = data.map((item, index) => {
        const isClient = (item.TIPO || "").toUpperCase() === "CLIENTE";
        const iconBg = isClient ? "record-icon-client" : "record-icon-competition";
        const badgeBg = isClient ? "badge-client" : "badge-competition";

        return `
          <div class="record-card cursor-pointer rounded-lg border p-3.5 transition" onclick="focusRecord(${index})">
            <div class="flex items-start gap-3">
              <div class="${iconBg} flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border font-bold">
                <i data-lucide="${isClient ? 'user-check' : 'building-2'}" class="h-5 w-5"></i>
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="record-title truncate text-sm font-bold text-slate-900">${item.NOMBRE || "Sin Nombre"}</h3>
                  <span class="${badgeBg} rounded px-1.5 py-0.5 text-[10px] font-extrabold uppercase text-white">${item.TIPO}</span>
                </div>
                <p class="record-meta mt-1 truncate text-xs text-slate-600">${item.ZONA || ""}, ${item.ESTADO || ""}</p>
                <p class="record-subtle mt-0.5 truncate text-xs text-slate-500">${item.DIRECCION || ""}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");

      if (window.lucide) lucide.createIcons();
    }

    function renderMapMarkers(data) {
      markersCluster.clearLayers();
      markersMap.clear();

      data.forEach((item, index) => {
        const coords = parseCoords(item.COORDENADAS);
        if (!coords) return;

        const isClient = (item.TIPO || "").toUpperCase() === "CLIENTE";
        const markerClass = isClient ? "marker-client" : "marker-competition";
        const iconName = isClient ? "user-check" : "building-2";

        const customIcon = L.divIcon({
          className: "custom-marker-wrap",
          html: `
            <div class="custom-marker ${markerClass}">
              <span class="marker-icon"><i data-lucide="${iconName}"></i></span>
            </div>
          `,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker(coords, { icon: customIcon });
        marker.bindPopup(createPopupContent(item));

        markersCluster.addLayer(marker);
        markersMap.set(index, { marker, coords });
      });

      if (window.lucide) lucide.createIcons();
    }

    function parseCoords(coordStr) {
      if (!coordStr) return null;
      const parts = coordStr.split(",").map(p => parseFloat(p.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return [parts[0], parts[1]];
      }
      return null;
    }

    function createPopupContent(item) {
      const isClient = (item.TIPO || "").toUpperCase() === "CLIENTE";
      const badgeClass = isClient ? "badge-client" : "badge-competition";
      const cleanPhone = (item.TELEFONO || "").replace(/\D/g, "");

      let actionsHtml = "";
      if (item.TELEFONO) {
        actionsHtml += `<a href="https://wa.me/${cleanPhone}" target="_blank" class="popup-action popup-whatsapp"><i data-lucide="message-circle"></i> WhatsApp</a>`;
      }
      if (item.INSTAGRAM) {
        const handle = item.INSTAGRAM.replace("@", "");
        actionsHtml += `<a href="https://instagram.com/${handle}" target="_blank" class="popup-action popup-instagram"><i data-lucide="instagram"></i> Instagram</a>`;
      }
      if (item.WEB) {
        actionsHtml += `<a href="${item.WEB}" target="_blank" class="popup-action popup-web"><i data-lucide="globe"></i> Sitio Web</a>`;
      }

      return `
        <div class="contact-popup">
          <span class="${badgeClass} rounded px-2 py-0.5 text-[10px] font-extrabold uppercase text-white">${item.TIPO}</span>
          <h2 class="popup-title">${item.NOMBRE || "Sin Nombre"}</h2>
          <div class="popup-details">
            <div><b>Ubicación:</b> ${item.ZONA || ""}, ${item.ESTADO || ""}</div>
            <div><b>Dirección:</b> ${item.DIRECCION || "No especificada"}</div>
            ${item.TELEFONO ? `<div><b>Teléfono:</b> ${item.TELEFONO}</div>` : ""}
            ${item.CORREO ? `<div><b>Correo:</b> ${item.CORREO}</div>` : ""}
          </div>
          ${actionsHtml ? `<div class="popup-actions">${actionsHtml}</div>` : ""}
        </div>
      `;
    }

    function focusRecord(index) {
      const item = markersMap.get(index);
      if (item) {
        map.setView(item.coords, 14);
        item.marker.openPopup();
        if (window.innerWidth <= 900) {
          document.getElementById("sidebar").classList.remove("expanded");
        }
      } else {
        showToast("Registro sin coordenadas válidas para mostrar en mapa");
      }
    }

    function fitBounds() {
      if (markersCluster.getLayers().length > 0) {
        map.fitBounds(markersCluster.getBounds(), { padding: [50, 50] });
      } else {
        map.setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);
      }
    }

    function openModal() {
      document.getElementById("modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
      document.getElementById("recordForm").reset();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando...";

      try {
        await fetch(CONFIG.SHEET_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        recordsData.unshift(data);
        filterAndRender();
        closeModal();
        showToast("Registro guardado con éxito");
      } catch (err) {
        showToast("Error al guardar el registro");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="check" class="h-4 w-4"></i> Guardar Registro`;
        if (window.lucide) lucide.createIcons();
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = show ? "grid" : "none";
    }
  </script>
</body>
</html>
