<!-- Continuación y cierre de etiquetas del modal -->
          <label class="block">
            <span class="mb-1 block text-xs font-bold uppercase tracking-[0.12em] text-slate-400">Página Web</span>
            <input name="WEB" placeholder="https://ejemplo.com" class="form-input w-full rounded-lg border border-slate-200/10 bg-slate-950/55 px-3 py-3 text-sm text-white outline-none focus:border-cyan-300/40" />
          </label>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 border-t border-slate-200/10 px-5 py-4">
        <button type="button" id="cancelBtn" class="rounded-lg border border-slate-200/10 bg-white/5 px-4 py-2.5 text-sm font-bold text-slate-300 transition hover:bg-white/10">
          Cancelar
        </button>
        <button type="submit" id="saveBtn" class="primary-action flex items-center gap-2 rounded-lg px-5 py-2.5 text-sm font-bold transition">
          <i data-lucide="save" class="h-4 w-4"></i>
          Guardar
        </button>
      </div>
    </form>
  </div>

  <datalist id="venezuelaStates">
    <option value="Amazonas"></option>
    <option value="Anzoátegui"></option>
    <option value="Apure"></option>
    <option value="Aragua"></option>
    <option value="Barinas"></option>
    <option value="Bolívar"></option>
    <option value="Carabobo"></option>
    <option value="Cojedes"></option>
    <option value="Delta Amacuro"></option>
    <option value="Distrito Capital"></option>
    <option value="Falcón"></option>
    <option value="Guárico"></option>
    <option value="Lara"></option>
    <option value="Mérida"></option>
    <option value="Miranda"></option>
    <option value="Monagas"></option>
    <option value="Nueva Esparta"></option>
    <option value="Portuguesa"></option>
    <option value="Sucre"></option>
    <option value="Táchira"></option>
    <option value="Trujillo"></option>
    <option value="La Guaira"></option>
    <option value="Yaracuy"></option>
    <option value="Zulia"></option>
  </datalist>

  <script>
    // ==========================================
    // CONFIGURACIÓN Y ESTADO DE LA APLICACIÓN
    // ==========================================
    // Reemplaza esta URL con la endpoint de tu Apps Script o Webhook de Google Sheets
    const SCRIPT_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    let map;
    let markerCluster;
    let rawData = [];
    let markersMap = new Map();

    const filters = {
      search: "",
      type: "TODOS",
      state: "",
      zone: ""
    };

    // ==========================================
    // INICIALIZACIÓN
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      initMap();
      setupEventListeners();
      fetchData();
    });

    function initMap() {
      // Coordenadas centradas en Venezuela
      map = L.map("map", {
        zoomControl: true,
        attributionControl: false
      }).setView([8.0000, -66.0000], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
      }).addTo(map);

      // Agrupador de marcadores con configuración personalizada
      markerCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        spiderfyOnMaxZoom: true,
        iconCreateFunction: (cluster) => {
          const count = cluster.getChildCount();
          let cClass = "cluster-small";
          if (count > 20) cClass = "cluster-medium";
          if (count > 50) cClass = "cluster-large";

          return L.divIcon({
            html: `<div>${count}</div>`,
            className: `marker-cluster ${cClass}`,
            iconSize: L.point(40, 40)
          });
        }
      });

      map.addLayer(markerCluster);
    }

    // ==========================================
    // CARGA Y PROCESAMIENTO DE DATOS
    // ==========================================
    async function fetchData() {
      showLoading(true);
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        rawData = Array.isArray(data) ? data : (data.records || []);
        
        populateFilters();
        render();
      } catch (err) {
        console.error("Error al cargar los datos:", err);
        showToast("Error al conectar con Google Sheets", true);
      } finally {
        showLoading(false);
      }
    }

    function populateFilters() {
      const stateSelect = document.getElementById("stateFilter");
      const zoneSelect = document.getElementById("zoneFilter");

      const states = new Set();
      const zones = new Set();

      rawData.forEach(item => {
        if (item.ESTADO) states.add(item.ESTADO.trim());
        if (item.ZONA) zones.add(item.ZONA.trim());
      });

      stateSelect.innerHTML = '<option value="">Todos</option>' + 
        [...states].sort().map(s => `<option value="${s}">${s}</option>`).join("");
      
      zoneSelect.innerHTML = '<option value="">Todas</option>' + 
        [...zones].sort().map(z => `<option value="${z}">${z}</option>`).join("");
    }

    // ==========================================
    // RENDERING & FILTRADO
    // ==========================================
    function getFilteredData() {
      return rawData.filter(item => {
        const matchesType = filters.type === "TODOS" || (item.TIPO && item.TIPO.toUpperCase() === filters.type);
        const matchesState = !filters.state || item.ESTADO === filters.state;
        const matchesZone = !filters.zone || item.ZONA === filters.zone;
        
        const q = filters.search.toLowerCase();
        const matchesSearch = !q || 
          (item.NOMBRE && item.NOMBRE.toLowerCase().includes(q)) ||
          (item.DIRECCION && item.DIRECCION.toLowerCase().includes(q)) ||
          (item.ZONA && item.ZONA.toLowerCase().includes(q));

        return matchesType && matchesState && matchesZone && matchesSearch;
      });
    }

    function render() {
      const filtered = getFilteredData();
      
      // Actualizar contadores
      document.getElementById("totalCount").textContent = rawData.length;
      document.getElementById("clientCount").textContent = rawData.filter(r => r.TIPO?.toUpperCase() === "CLIENTE").length;
      document.getElementById("competitionCount").textContent = rawData.filter(r => r.TIPO?.toUpperCase() === "COMPETENCIA").length;
      document.getElementById("visibleCount").textContent = filtered.length;

      renderMapMarkers(filtered);
      renderList(filtered);
      lucide.createIcons();
    }

    function renderMapMarkers(data) {
      markerCluster.clearLayers();
      markersMap.clear();

      data.forEach((item, index) => {
        if (!item.COORDENADAS) return;
        const parts = item.COORDENADAS.split(",").map(c => parseFloat(c.trim()));
        if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return;

        const isClient = item.TIPO?.toUpperCase() === "CLIENTE";
        const markerClass = isClient ? "marker-client" : "marker-competition";
        const iconName = isClient ? "user-check" : "building-2";

        const customIcon = L.divIcon({
          className: "custom-marker-wrapper",
          html: `
            <div class="custom-marker ${markerClass}">
              <span class="marker-icon"><i data-lucide="${iconName}"></i></span>
            </div>
          `,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const marker = L.marker([parts[0], parts[1]], { icon: customIcon });
        marker.bindPopup(buildPopupHTML(item));

        markerCluster.addLayer(marker);
        markersMap.set(index, marker);
      });
    }

    function buildPopupHTML(item) {
      const isClient = item.TIPO?.toUpperCase() === "CLIENTE";
      const badgeClass = isClient ? "badge-client" : "badge-competition";
      
      const cleanPhone = item.TELEFONO ? item.TELEFONO.replace(/\D/g, "") : "";
      const cleanInsta = item.INSTAGRAM ? item.INSTAGRAM.replace("@", "").trim() : "";

      return `
        <div class="contact-popup">
          <span class="inline-block rounded-md px-2 py-0.5 text-xs font-bold ${badgeClass}">
            ${item.TIPO || "REGISTRO"}
          </span>
          <h3 class="popup-title">${item.NOMBRE || "Sin Nombre"}</h3>
          <div class="popup-details">
            <p><b>Zona/Estado:</b> ${item.ZONA || "-"}, ${item.ESTADO || "-"}</p>
            <p><b>Dirección:</b> ${item.DIRECCION || "No especificada"}</p>
          </div>
          <div class="popup-actions">
            ${cleanPhone ? `
              <a href="https://wa.me/${cleanPhone}" target="_blank" class="popup-action popup-whatsapp">
                <i data-lucide="message-circle"></i> WhatsApp
              </a>
            ` : ""}
            ${cleanInsta ? `
              <a href="https://instagram.com/${cleanInsta}" target="_blank" class="popup-action popup-instagram">
                <i data-lucide="instagram"></i> Instagram
              </a>
            ` : ""}
            ${item.WEB ? `
              <a href="${item.WEB.startsWith("http") ? item.WEB : "https://" + item.WEB}" target="_blank" class="popup-action popup-web">
                <i data-lucide="globe"></i> Sitio Web
              </a>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderList(data) {
      const listContainer = document.getElementById("list");
      if (data.length === 0) {
        listContainer.innerHTML = `
          <div class="py-8 text-center text-slate-400">
            <p class="text-sm">No se encontraron registros</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = data.map((item, idx) => {
        const isClient = item.TIPO?.toUpperCase() === "CLIENTE";
        const iconStyle = isClient ? "record-icon-client" : "record-icon-competition";
        const iconName = isClient ? "user-check" : "building-2";

        return `
          <div class="record-card cursor-pointer rounded-lg border p-3.5 transition" data-record-index="${idx}">
            <div class="flex items-start gap-3">
              <div class="grid h-9 w-9 shrink-0 place-items-center rounded-lg border ${iconStyle}">
                <i data-lucide="${iconName}" class="h-4 w-4"></i>
              </div>
              <div class="min-w-0 flex-1">
                <h4 class="record-title truncate text-sm font-bold">${item.NOMBRE || "Sin Nombre"}</h4>
                <p class="record-meta text-xs text-slate-500">${item.ZONA || "-"}, ${item.ESTADO || "-"}</p>
                <p class="record-subtle truncate text-xs text-slate-400">${item.DIRECCION || ""}</p>
              </div>
            </div>
          </div>
        `;
      }).join("");

      // Evento al hacer clic en un ítem de la lista
      listContainer.querySelectorAll(".record-card").forEach(card => {
        card.addEventListener("click", () => {
          const idx = parseInt(card.dataset.recordIndex, 10);
          const item = data[idx];
          if (item && item.COORDENADAS) {
            const parts = item.COORDENADAS.split(",").map(c => parseFloat(c.trim()));
            if (parts.length === 2 && !isNaN(parts[0])) {
              map.flyTo([parts[0], parts[1]], 15, { duration: 1.2 });
              const marker = markersMap.get(idx);
              if (marker) marker.openPopup();
              
              // Cerrar sidebar en móvil si está expandida
              if (window.innerWidth <= 900) {
                document.getElementById("sidebar").classList.remove("expanded");
              }
            }
          }
        });
      });
    }

    // ==========================================
    // EVENTOS Y MANIPULACIÓN DEL DOM
    // ==========================================
    function setupEventListeners() {
      // Filtros
      document.getElementById("searchInput").addEventListener("input", (e) => {
        filters.search = e.target.value;
        render();
      });

      document.getElementById("stateFilter").addEventListener("change", (e) => {
        filters.state = e.target.value;
        render();
      });

      document.getElementById("zoneFilter").addEventListener("change", (e) => {
        filters.zone = e.target.value;
        render();
      });

      // Pestañas de tipo
      document.querySelectorAll(".type-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".type-tab").forEach(t => t.classList.remove("is-active"));
          tab.classList.add("is-active");
          filters.type = tab.dataset.type;
          render();
        });
      });

      // Tarjetas de estadísticas
      document.querySelectorAll("[data-stat-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
          const type = btn.dataset.statFilter;
          filters.type = type;
          document.querySelectorAll(".type-tab").forEach(t => {
            t.classList.toggle("is-active", t.dataset.type === type);
          });
          render();
        });
      });

      // Botón Ajustar vista
      document.getElementById("fitBtn").addEventListener("click", () => {
        if (markerCluster.getLayers().length > 0) {
          map.fitBounds(markerCluster.getBounds(), { padding: [40, 40] });
        }
      });

      // Botón Actualizar
      document.getElementById("refreshBtn").addEventListener("click", fetchData);

      // Botón abrir y cerrar modal
      const modal = document.getElementById("modal");
      const openModal = () => modal.classList.add("open");
      const closeModal = () => {
        modal.classList.remove("open");
        document.getElementById("recordForm").reset();
      };

      document.getElementById("newRecordBtn").addEventListener("click", openModal);
      document.getElementById("mobileNewBtn").addEventListener("click", openModal);
      document.getElementById("closeModalBtn").addEventListener("click", closeModal);
      document.getElementById("cancelBtn").addEventListener("click", closeModal);

      // Desplegable móvil (Bottom Sheet)
      const sidebar = document.getElementById("sidebar");
      document.getElementById("sheetToggle").addEventListener("click", () => {
        sidebar.classList.toggle("expanded");
      });

      // Envío de formulario a Google Sheets
      document.getElementById("recordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const payload = Object.fromEntries(formData.entries());

        showLoading(true);
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          showToast("Registro guardado con éxito");
          closeModal();
          // Esperar un momento a que Apps Script procese antes de recargar
          setTimeout(fetchData, 1200);
        } catch (err) {
          console.error("Error al guardar:", err);
          showToast("Error al guardar el registro", true);
          showLoading(false);
        }
      });
    }

    // ==========================================
    // UTILIDADES DE UI
    // ==========================================
    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = show ? "grid" : "none";
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toastText");
      
      text.textContent = message;
      toast.classList.toggle("border-rose-300/20", isError);
      toast.classList.toggle("border-emerald-300/20", !isError);
      
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3500);
    }
  </script>
