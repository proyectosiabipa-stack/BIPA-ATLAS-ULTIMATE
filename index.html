<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Clientes - Gestión Geográfica</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Estilos personalizados y correcciones de layout */
    #map {
      min-height: 400px;
      height: 100%;
      width: 100%;
      z-index: 10;
      border-radius: 0.75rem;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Ajuste responsivo de la cuadrícula en pantallas grandes */
    @media (min-width: 1280px) {
      main.dashboard-grid {
        display: grid;
        grid-template-columns: 280px 300px minmax(0, 1fr) 380px;
        gap: 1rem;
        height: calc(100vh - 80px);
      }
      
      main.dashboard-grid > section {
        height: 100%;
        overflow-y: auto;
      }

      /* Garantizar visibilidad de todas las secciones en xl */
      main.dashboard-grid > section:nth-of-type(4) {
        display: flex !important;
        flex-direction: column;
      }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header / Barra Superior -->
  <header class="bg-slate-900 text-white px-6 py-4 shadow-md flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <i data-lucide="map-pin" class="text-blue-400 w-7 h-7"></i>
      <h1 class="text-xl font-bold tracking-wide">Directorio y Mapa de Clientes</h1>
    </div>
    
    <!-- Buscador Global -->
    <div class="relative flex-1 max-w-md">
      <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
      <input type="text" id="search" placeholder="Buscar por ID, nombre de cliente..." 
             class="w-full pl-9 pr-4 py-2 bg-slate-800 text-white placeholder-slate-400 rounded-lg text-sm border border-slate-700 focus:outline-none focus:border-blue-500 transition">
    </div>

    <!-- Acciones del Header -->
    <div class="flex items-center gap-2">
      <button id="reset" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition border border-slate-700">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        Limpiar Filtros
      </button>
    </div>
  </header>

  <!-- Contenido Principal (Layout 4 Columnas / Adaptativo) -->
  <main class="dashboard-grid p-4 flex-1 flex flex-col xl:flex-row gap-4 overflow-hidden">
    
    <!-- SECCIÓN 1: Tarjetas KPI de Resumen -->
    <section class="flex flex-col gap-3">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Clientes</p>
          <h3 id="kTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
          <i data-lucide="users" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Estados Activos</p>
          <h3 id="kStates" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
          <i data-lucide="building-2" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Zonas Registradas</p>
          <h3 id="kZones" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
          <i data-lucide="compass" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Con Teléfono</p>
          <h3 id="kPhone" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">
          <i data-lucide="phone-call" class="w-6 h-6"></i>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 2: Filtros Secundarios (Estado y Zona) -->
    <aside class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4">
      <h2 class="text-md font-bold text-slate-700 flex items-center gap-2 border-b pb-2">
        <i data-lucide="filter" class="w-4 h-4 text-blue-500"></i>
        Filtros de Ubicación
      </h2>

      <!-- Filtro Estado -->
      <div class="flex flex-col gap-1.5">
        <label for="stateSel" class="text-xs font-medium text-slate-600">Filtrar por Estado</label>
        <select id="stateSel" class="w-full bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Todos los Estados</option>
        </select>
      </div>

      <!-- Filtro Zona -->
      <div class="flex flex-col gap-1.5">
        <label for="zoneSel" class="text-xs font-medium text-slate-600">Filtrar por Zona</label>
        <select id="zoneSel" class="w-full bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Todas las Zonas</option>
        </select>
      </div>
    </aside>

    <!-- SECCIÓN 3: Visor del Mapa Interactivo -->
    <section class="bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[400px]">
      <div id="map"></div>
    </section>

    <!-- SECCIÓN 4: Lista Dinámica de Clientes y Detalle -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h2 class="text-md font-bold text-slate-700 flex items-center gap-2">
          <i data-lucide="list" class="w-4 h-4 text-blue-500"></i>
          Resultados
        </h2>
        <span id="recordModal" class="text-xs font-semibold px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full">0 cargados</span>
      </div>

      <!-- Contenedor con scroll para los ítems de clientes -->
      <div id="clientList" class="flex-1 overflow-y-auto p-3 space-y-2">
        <!-- Generado dinámicamente -->
      </div>

      <!-- Paginador -->
      <div class="p-3 border-t border-slate-200 flex justify-between items-center bg-slate-50 text-xs">
        <button id="prev" class="px-3 py-1.5 bg-white border border-slate-300 rounded-md hover:bg-slate-100 disabled:opacity-50 transition">Anterior</button>
        <span id="pageInfo" class="text-slate-600 font-medium">Página 1</span>
        <button id="next" class="px-3 py-1.5 bg-white border border-slate-300 rounded-md hover:bg-slate-100 disabled:opacity-50 transition">Siguiente</button>
      </div>
    </section>

  </main>

  <!-- Librerías de Mapa -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Lógica de Datos y Script Integrado -->
  <script>
    // 1. DATA (Formato corregido y limpio)
    const DATA = [
      {
        "id": 101,
        "cliente": "Comercializadora del Norte S.A.",
        "estado": "Nuevo León",
        "zona": "Norte",
        "telefono": "8181234567",
        "coordenadas": { "lat": 25.6866, "lng": -100.3161 }
      },
      {
        "id": 102,
        "cliente": "Distribuidora del Centro",
        "estado": "Ciudad de México",
        "zona": "Centro",
        "telefono": "5555551234",
        "coordenadas": { "lat": 19.4326, "lng": -99.1332 }
      },
      {
        "id": 103,
        "cliente": "Grupo Industrial Occidente",
        "estado": "Jalisco",
        "zona": "Occidente",
        "telefono": "3338129900",
        "coordenadas": { "lat": 20.6597, "lng": -103.3496 }
      },
      {
        "id": 104,
        "cliente": "Suministros del Pacífico",
        "estado": "Sinaloa",
        "zona": "Pacífico",
        "telefono": "Sin teléfono",
        "coordenadas": { "lat": 24.8091, "lng": -107.3940 }
      },
      {
        "id": 105,
        "cliente": "Servicios Logísticos del Sureste",
        "estado": "Yucatán",
        "zona": "Sur",
        "telefono": "9999283746",
        "coordenadas": { "lat": 20.9674, "lng": -89.5926 }
      }
    ];

    // 2. Control Principal de la Aplicación
    document.addEventListener("DOMContentLoaded", function () {
      // Inicializar Iconos Lucide
      if (window.lucide) {
        lucide.createIcons();
      }

      // Estado de Paginación
      let currentPage = 1;
      const itemsPerPage = 10;

      // Elementos DOM
      const searchInput = document.getElementById('search');
      const stateSel = document.getElementById('stateSel');
      const zoneSel = document.getElementById('zoneSel');
      const resetBtn = document.getElementById('reset');
      
      const kTotal = document.getElementById('kTotal');
      const kStates = document.getElementById('kStates');
      const kZones = document.getElementById('kZones');
      const kPhone = document.getElementById('kPhone');

      const clientList = document.getElementById('clientList');
      const recordModal = document.getElementById('recordModal');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const pageInfo = document.getElementById('pageInfo');

      // Inicialización del Mapa
      const defaultCenter = [23.6345, -102.5528]; // Centro aproximado de México
      const map = L.map('map').setView(defaultCenter, 5);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(map);

      const markersCluster = L.markerClusterGroup();
      map.addLayer(markersCluster);

      // Poblar Filtros
      function populateFilterSelects() {
        const states = [...new Set(DATA.map(d => d.estado).filter(Boolean))].sort();
        const zones = [...new Set(DATA.map(d => d.zona).filter(Boolean))].sort();

        states.forEach(st => {
          const opt = document.createElement('option');
          opt.value = st;
          opt.textContent = st;
          stateSel.appendChild(opt);
        });

        zones.forEach(zn => {
          const opt = document.createElement('option');
          opt.value = zn;
          opt.textContent = zn;
          zoneSel.appendChild(opt);
        });
      }

      // Lógica de Renderizado Global
      function render() {
        const searchTerm = (searchInput.value || '').toLowerCase();
        const selectedState = stateSel.value || '';
        const selectedZone = zoneSel.value || '';

        // Filtrar Datos
        const filteredData = DATA.filter(item => {
          const matchSearch = !searchTerm || 
            (item.cliente && item.cliente.toLowerCase().includes(searchTerm)) ||
            (item.id && item.id.toString().includes(searchTerm));
          const matchState = !selectedState || item.estado === selectedState;
          const matchZone = !selectedZone || item.zona === selectedZone;

          return matchSearch && matchState && matchZone;
        });

        // Actualizar KPIs
        kTotal.textContent = filteredData.length;
        kStates.textContent = new Set(filteredData.map(i => i.estado).filter(Boolean)).size;
        kZones.textContent = new Set(filteredData.map(i => i.zona).filter(Boolean)).size;
        kPhone.textContent = filteredData.filter(i => i.telefono && i.telefono !== 'Sin teléfono' && i.telefono !== '#ERROR!').length;

        // Actualizar Marcadores
        markersCluster.clearLayers();
        const bounds = [];

        filteredData.forEach(item => {
          if (item.coordenadas && item.coordenadas.lat && item.coordenadas.lng) {
            const marker = L.marker([item.coordenadas.lat, item.coordenadas.lng])
              .bindPopup(`
                <div class="p-1">
                  <strong class="text-sm block font-bold text-slate-800">${item.cliente}</strong>
                  <span class="text-xs text-slate-600 block">Estado: ${item.estado}</span>
                  <span class="text-xs text-slate-600 block">Zona: ${item.zona}</span>
                  <span class="text-xs text-blue-600 block mt-1">Tel: ${item.telefono}</span>
                </div>
              `);
            markersCluster.addLayer(marker);
            bounds.push([item.coordenadas.lat, item.coordenadas.lng]);
          }
        });

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
        }

        // Renderizar Lista Paginada
        recordModal.textContent = `${filteredData.length} registros`;
        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredData.slice(start, start + itemsPerPage);

        clientList.innerHTML = '';

        if (pageItems.length === 0) {
          clientList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No se encontraron registros</p>`;
        } else {
          pageItems.forEach(item => {
            const card = document.createElement('div');
            card.className = "p-3 bg-slate-50 border border-slate-200 rounded-lg hover:border-blue-400 hover:bg-blue-50/50 transition cursor-pointer";
            card.innerHTML = `
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-bold px-2 py-0.5 bg-slate-200 text-slate-700 rounded">ID: ${item.id}</span>
                <span class="text-xs text-slate-500">${item.zona || 'N/A'}</span>
              </div>
              <h4 class="text-sm font-semibold text-slate-800 mt-1">${item.cliente}</h4>
              <p class="text-xs text-slate-500 mt-0.5">${item.estado || 'N/A'}</p>
            `;

            // Centrar mapa al hacer click
            card.addEventListener('click', () => {
              if (item.coordenadas && item.coordenadas.lat) {
                map.setView([item.coordenadas.lat, item.coordenadas.lng], 12);
              }
            });

            clientList.appendChild(card);
          });
        }

        // Paginador
        pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
      }

      // Event Listeners de Controles
      searchInput.addEventListener('input', () => { currentPage = 1; render(); });
      stateSel.addEventListener('change', () => { currentPage = 1; render(); });
      zoneSel.addEventListener('change', () => { currentPage = 1; render(); });

      resetBtn.addEventListener('click', () => {
        searchInput.value = '';
        stateSel.value = '';
        zoneSel.value = '';
        currentPage = 1;
        render();
      });

      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          render();
        }
      });

      nextBtn.addEventListener('click', () => {
        currentPage++;
        render();
      });

      // Inicialización
      populateFilterSelects();
      render();
    });
  </script>
</body>
</html>
